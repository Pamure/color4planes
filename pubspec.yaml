name: color4planes
description: "Color4Planes — arcade shooter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game engine
  flame:       ^1.35.1
  flame_audio: ^2.11.14
  # flame_riverpod removed — we use a manual widgetRef setter.
  # The package's value is ref.watch/ref.listen lifecycle management.
  # This game only uses ref.read (one-shot), which needs no lifecycle.
  # See game_screen.dart for the full explanation.

  # State management
  flutter_riverpod: ^3.2.1

  # Navigation
  go_router: ^17.1.0

  # Storage
  shared_preferences: ^2.5.4
  uuid:               ^4.5.3
  nakama: ^1.3.0
  rxdart: ^0.28.0
  google_fonts: ^8.0.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#0a0a0f"